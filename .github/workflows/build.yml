name: Build & Release

on:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.11.1
          pip install -r requirements.txt

      - name: Get version
        id: version
        shell: bash
        run: echo "version=$(python -c 'from version import VERSION; print(VERSION)')" >> $GITHUB_OUTPUT

      - name: Build exe with PyInstaller
        run: pyinstaller valo_optimise.spec

      - name: Verify exe was produced
        shell: bash
        run: |
          ls dist/
          test -f dist/ValoOptimise.exe && echo "Build OK" || (echo "Build FAILED" && exit 1)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Valo Optimise v${{ steps.version.outputs.version }} — Public Beta"
          repository: harveyjenkins03-coder/valo-optimise
          token: ${{ secrets.RELEASE_PAT }}
          body: |
            <div align="center">

            # 🎮 Valo Optimise v${{ steps.version.outputs.version }} — Public Beta
            **Free Windows performance suite built for competitive Valorant players.**
            We're in public beta — your download and feedback directly shapes the v1.0 release.
            Tune your OS, network, CPU, GPU and mouse — no game files touched, no bloat, no risk.

            [![Windows](https://img.shields.io/badge/Windows-10%20%2F%2011-0078D6?logo=windows)](https://valooptimise.com)
            [![Vanguard Safe](https://img.shields.io/badge/Vanguard-Safe-00d4aa?logo=riotgames)](https://valooptimise.com)
            [![Free](https://img.shields.io/badge/Free-Always-ff4655)](https://valooptimise.com)
            [![Pro](https://img.shields.io/badge/Pro-£4.99%2Fmo-ffd700)](https://valooptimise.gumroad.com/l/uriyw)

            </div>

            ---

            ## ⬇️ Download & Install

            1. Click **`ValoOptimise.exe`** below to download
            2. **Right-click → Run as administrator**
            3. Accept the UAC prompt — required for system-level tweaks
            4. Follow the first-launch setup wizard

            > **Requirements:** Windows 10 or 11 · Administrator rights · ~50MB disk space

            ---

            ## ✨ What Valo Optimise Does

            | Category | Optimisations |
            |----------|--------------|
            | ⚡ **System** | Ultimate Performance power plan · RAM optimisation · background process cleanup |
            | 🌐 **Network** | DNS → Cloudflare 1.1.1.1 · TCP auto-tuning · NIC power saving off · ping reduction |
            | 🖥️ **GPU** | AMD ULPS off · HAGS toggle · shader cache management |
            | 🖱️ **Mouse** | Raw input · acceleration off · USB polling rate monitor · eDPI calculator |
            | 🎮 **Valorant** | GameUserSettings.ini editor · resolution & FPS cap tuning |
            | 🔊 **Audio** | MMCSS priority boost · Windows Sonic disable |
            | ⏱️ **CPU** | 1ms timer resolution · core parking off · CPU boost mode |
            | 🗑️ **Startup** | Startup program manager — remove bloat from boot |
            | 📊 **Stats** | Match history tracker with MMR lookup |
