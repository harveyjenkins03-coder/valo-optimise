            ---

            ## 🔒 Security & Privacy

            - **Zero game process interaction** — only OS-level changes. Riot Vanguard has no issue with this tool.
            - **No data collection** — no telemetry, no analytics, no crash reporting. Nothing leaves your PC.
            - **No internet required** — all optimisations run locally. The only optional network call is the Valorant stats lookup, which is entirely opt-in.
            - **Registry backups** — every tweak is backed up before being applied. One-click revert available in-app.
            - **Official release only** — always download from this page. Do not run `.exe` files from any other source claiming to be Valo Optimise.
            - **UAC elevation** — admin rights are used solely for registry and system settings. No personal files are accessed.

