name: Build & Release

on:
  push:
    tags: [ 'v*' ]   # Only run on version tags (e.g. v2.0.1)

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller==6.11.1
          pip install -r requirements.txt

      - name: Get version
        id: version
        shell: bash
        run: echo "version=$(python -c 'from version import VERSION; print(VERSION)')" >> $GITHUB_OUTPUT

      - name: Generate app icon
        run: python create_icon.py

      - name: Build exe with PyInstaller
        run: pyinstaller valo_optimise.spec

      - name: Verify exe was produced
        shell: bash
        run: |
          ls dist/
          test -f dist/ValoOptimise.exe && echo "Build OK" || (echo "Build FAILED" && exit 1)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "Valo Optimise v${{ steps.version.outputs.version }}"
          body: |
            ## Valo Optimise v${{ steps.version.outputs.version }}

            **Gaming performance suite for Windows.**
            Tune your OS, network, CPU, GPU and mouse — no game files touched, anti-cheat safe.

            ### Download & Install

            1. Download **ValoOptimise.exe** below
            2. Right-click → Run as administrator
            3. Follow the setup wizard

            > Windows SmartScreen may show a warning — click **More info → Run anyway**.
            > Requirements: Windows 10/11 · Administrator rights · ~50MB disk

            ### Safety

            - Anti-cheat safe (Vanguard, EAC, BattlEye)
            - Zero game process interaction — OS-level only
            - No data collection, no telemetry
            - All changes fully reversible with in-app backup

            [Website](https://valooptimise.com) · [Get Pro](https://valooptimise.gumroad.com/l/uriyw) · [Privacy Policy](https://valooptimise.com/privacy.html)
          files: dist/ValoOptimise.exe
          fail_on_unmatched_files: true
          make_latest: true
